<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DERBY DYNASTY</title>
<style>
:root{--bg:#eef1ea;--c:#fff;--t:#1b2b22;--a:#0b6b3a;--m:#7a8a80;--h:#fff3c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a15;--c:#1c2b23;--t:#eef;--a:#3ecf84;--m:#8fa396;--h:#3a3516}}
:root[data-theme=dark]{--bg:#101a15;--c:#1c2b23;--t:#eef;--a:#3ecf84;--m:#8fa396;--h:#3a3516}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;max-width:560px;margin:auto;padding:0 10px 90px}
.card{background:var(--c);border-radius:14px;padding:12px;margin:9px 0;box-shadow:0 1px 3px #0002}.hint{background:var(--h)}.dim{opacity:.6}
button{font-size:16px;padding:12px 14px;border:0;border-radius:12px;background:var(--a);color:#fff;margin:3px;min-height:46px}button.s{background:var(--m)}button:disabled{opacity:.35}button.big{width:100%;font-size:19px;margin:6px 0;min-height:54px}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:8px 2px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:580px;margin:auto;display:flex;background:var(--c);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 6px #0003;z-index:5}
nav button{flex:1;margin:2px;padding:6px 0;font-size:12px;background:none;color:var(--m)}nav button.on{color:var(--a);font-weight:bold}nav span{display:block;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0;min-height:76px;font-size:17px;background:var(--c);color:var(--t);box-shadow:0 1px 3px #0002}
.bar{height:9px;background:#8884;border-radius:5px;margin:2px 0 7px}.bar i{display:block;height:9px;border-radius:5px;background:var(--a)}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.ti{text-align:center;padding-top:50px}.ti h1{font-size:44px;letter-spacing:3px;margin:6px}.lg{font-size:70px}
input,select{font-size:16px;padding:10px;width:100%;margin:4px 0;border-radius:8px;border:1px solid #8886;background:var(--c);color:var(--t)}
.lane{height:28px;margin:3px 0;border-bottom:1px dashed #8886;position:relative;background:linear-gradient(90deg,#0000 88%,#fff3 88%,#f00 100%)}.num{position:absolute;left:0;top:3px;width:22px;height:22px;border-radius:50%;color:#fff;font-size:13px;text-align:center;line-height:22px}
.hz{position:absolute;top:2px;margin-left:26px;font-size:20px}.com{font-size:18px;min-height:96px;line-height:1.5}.com small{display:block;color:var(--m);font-size:13px}
.chip{display:inline-block;padding:10px 12px;margin:3px;border-radius:10px;background:#8883;min-width:44px;text-align:center}.chip.on{background:var(--a);color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:9;pointer-events:none;max-width:90%}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 3px;border-bottom:1px solid #8883}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const K='dd2',$=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n),yen=n=>'¥'+Math.round(n).toLocaleString();
const ST=['逃げ','先行','差し','追込'],SK={逃げ:.12,先行:.06,差し:-.06,追込:-.12},L={spd:'スピード',sta:'スタミナ',pow:'パワー',gut:'根性',int:'賢さ'};
const CL=[{n:'新馬戦',r:40,b:60000,w:0},{n:'1勝クラス',r:50,b:100000,w:1},{n:'オープン',r:62,b:200000,w:3},{n:'G3',r:72,b:400000,w:5},{n:'G2',r:82,b:800000,w:8},{n:'G1',r:92,b:2000000,w:12}];
const PZ=[1,.4,.2,.1,.05,.03,.02,.01],PC=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#6d4c41','#546e7a'];
const TY={win:['単勝',1],plc:['複勝',1],quin:['馬連',2],waku:['枠連',2],exa:['馬単',2],wide:['ワイド',2],trio:['3連複',3],tri:['3連単',3]};
const N1=['サンダー','ブラック','ゴールド','ブルー','レッド','スカイ','ダーク','ホワイト','キング','ラスト','シルバー','ミラクル'],N2=['ロード','スター','ウイング','ファング','エース','ムーン','アロー','レジェンド','ハート','ブレイズ'],MIN=4800;
const def=()=>({m:100000,hs:[],o:{com:1,voice:0,se:1,sp:1,th:'auto'},t:{tr:0,race:0},own:'馬主',sel:0,mkt:null,wd:'',wn:0});
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.o)return s}catch(e){}return def()})();
let V={scr:'title',sub:'',cls:0,race:null,cf:'',tmp:{},bet:{t:'win',sel:[],a:1000}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const mk=(r,name)=>{const g=()=>Math.max(20,Math.round(r+rnd(15)-7));return{n:name||N1[rnd(12)]+N2[rnd(10)],spd:g(),sta:g(),pow:g(),gut:g(),int:g(),fat:0,w:0,r:0,e:0,st:ST[rnd(4)]}};
const ovr=h=>Math.round((h.spd+h.sta+h.pow+h.gut+h.int)/5),H=()=>S.hs[Math.min(S.sel,S.hs.length-1)];
const cf=h=>h.fat<30?1.02:h.fat<60?1:h.fat<80?.95:.88,cond=h=>h.fat<30?'絶好調':h.fat<60?'普通':h.fat<80?'疲労':'休養推奨';
function str(h,d){const w=d<1500?[.4,.2,.25]:d<2100?[.35,.3,.2]:[.3,.4,.15];return(w[0]*h.spd+w[1]*h.sta+w[2]*h.pow+.1*h.gut+.05*h.int)/(w[0]+w[1]+w[2]+.15)*cf(h)}
const rk=s=>s>=85?'S':s>=70?'A':s>=55?'B':s>=40?'C':'D',lv=()=>1+Math.floor(S.hs.reduce((a,x)=>a+x.w*2+x.r/5,0)/3);
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1800)}
let AC;function beep(f,d){if(!S.o.se)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function go(s,sub){V.scr=s;V.sub=sub||'';V.cf='';R();scrollTo(0,0)}
function hint(){const h=H();if(!S.t.tr)return'👉 まず「育成」で馬を鍛えてみよう(おまかせ育成が簡単)';if(!S.t.race)return'👉 次は「レース」へ。新馬戦がおすすめ!';if(h.r&&!h.w)return'👉 勝つまで「育成→出走」をくり返そう。疲労には休養!';if(S.hs.length<2)return'👉 賞金で「馬市場」から2頭目を買おう(最大10頭)';return'👉 勝ち数を増やして上のクラスを目指そう。疲れた馬は休ませて!'}
function R(){document.documentElement.dataset.theme=S.o.th=='auto'?'':S.o.th;applyBarn();if(!S.hs.length&&!['title','set','help'].includes(V.scr))V.scr='title';
 const s=V.scr,A=$('#app');if(s=='title'){A.innerHTML=title();return}
 const nv=[['home','🏠','ホーム'],['stable','🐎','厩舎'],['train','💪','育成'],['race','🏁','レース'],['market','🐴','市場']];
 A.innerHTML=`<div class=tb><b>🏇 DERBY DYNASTY</b><span><b>${yen(S.m)}</b> <button class=s style="padding:4px 10px;min-height:36px" onclick="go('set')">⚙</button></span></div>`+({home,stable,train,race,market,set:setv,help,online}[s]||home)()+(S.hs.length?`<nav>${nv.map(([k,i,l])=>`<button class="${s==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')}</nav>`:'')}
function title(){const has=S.hs.length>0;if(V.sub=='new')return`<div class=ti><h2>はじめての馬主登録</h2><div class=card style="text-align:left">馬主名<input id=own maxlength=8 value="馬主"><br>最初の馬の名前<input id=hn maxlength=10 placeholder="空欄ならランダム"><br>タイプ<select id=ty><option value=b>バランス型</option><option value=s>スピード型</option><option value=t>スタミナ型</option></select></div><button class=big onclick="newGame()">牧場をはじめる</button><button class="big s" onclick="go('title')">戻る</button></div>`;
 return`<div class=ti><div class=lg>🏇</div><h1>DERBY<br>DYNASTY</h1><p style="color:var(--m)">育てろ。走らせろ。賭けろ。勝て。</p>${has?`<button class=big onclick="go('home')">つづきから</button>`:''}<button class="big ${has?'s':''}" onclick="${has?`V.sub='new';R()`:`go('title','new')`}">はじめから</button><button class="big s" onclick="go('help')">あそびかた</button><button class="big s" onclick="go('set')">設定</button></div>`}
function newGame(){const keep=S.o,n=$('#hn').value.trim(),t=$('#ty').value;S=def();S.o=keep;S.own=($('#own').value.trim()||'馬主').slice(0,8);const h=mk(46,n.slice(0,10));if(t=='s'){h.spd+=8;h.sta-=4}if(t=='t'){h.sta+=8;h.spd-=4}S.hs=[h];save();go('home')}
function workCard(){const t=V.tmp.w||0;return`<div class=card><b>⛏ 地下労働(救済)</b><p>資金が足りません。タップ(PCはSpace)で作業、20回で¥3,000。1日¥12,000まで。馬は失いません。</p><button class=big onclick="work()">掘る! ${t}/20</button></div>`}
function work(){const d=new Date().toDateString();if(S.wd!=d){S.wd=d;S.wn=0}if(S.wn>=12000)return toast('今日の作業上限です。馬の売却も検討しよう');V.tmp.w=(V.tmp.w||0)+1;beep(300,.05);if(V.tmp.w>=20){V.tmp.w=0;S.m+=3000;S.wn+=3000;toast('+¥3,000')}save();R()}
addEventListener('keydown',e=>{if(e.code=='Space'&&S.m<MIN&&['home','race'].includes(V.scr)&&V.sub!='run'){e.preventDefault();work()}});
function home(){const h=S.hs.slice().sort((a,b)=>ovr(b)-ovr(a))[0],w=S.hs.reduce((a,x)=>a+x.w,0),r=S.hs.reduce((a,x)=>a+x.r,0);
 return`<div class="card hint">${hint()}</div>${S.m<MIN?workCard():''}<div class=card><b>${S.own}の厩舎</b>　Lv${lv()}<br>所有馬 ${S.hs.length}/10　通算${r}戦${w}勝</div><div class=card><small>エース</small><br><b>${h.n}</b>　総合${ovr(h)}　${h.st}　${cond(h)}</div><div class=grid>${[['train','💪','育成'],['race','🏁','レース'],['stable','🐎','厩舎'],['market','🐴','馬市場'],['set','⚙️','設定'],['help','❓','あそびかた']].map(([k,i,l])=>`<button onclick="go('${k}')">${i}<br>${l}</button>`).join('')}</div><button class=big onclick="go('online')">🌐 オンライン対戦(8頭立て)</button>`}
function stable(){const h=H();return`<div class=card><b>厩舎</b> ${S.hs.length}/10頭　<small>タップで選択</small></div>`+S.hs.map((x,i)=>`<div class=card style="${x==h?'outline:2px solid var(--a)':''}" onclick="S.sel=${i};R()"><b>${x.n}</b>　総合${ovr(x)}　${x.st}<br><small>${cond(x)}・疲労${x.fat}　${x.r}戦${x.w}勝　賞金${yen(x.e)}</small><div class=bar><i style="width:${x.fat}%;background:${x.fat>80?'#e53935':x.fat>60?'#fb8c00':'var(--a)'}"></i></div></div>`).join('')+`<div class=card><button onclick="go('train')">この馬を育成</button><button class=s ${S.hs.length<2?'disabled':''} onclick="sell()">${V.cf=='sell'?'本当に売却(もう一度)':'売却 '+yen(sp(h))}</button></div>`}
const price=h=>Math.round(ovr(h)**2*30/100)*100,sp=h=>Math.round(ovr(h)**2*18/100)*100;
function sell(){const h=H();if(V.cf!='sell'){V.cf='sell';return R()}S.m+=sp(h);S.hs.splice(S.hs.indexOf(h),1);S.sel=0;V.cf='';save();toast(h.n+'を売却');R()}
function market(){if(!S.mkt)S.mkt=[0,1,2,3].map(i=>mk(35+rnd(28)+i*3));return`<div class=card><b>馬市場</b>　所有 ${S.hs.length}/10${S.hs.length>=10?'<br><small>満杯です。厩舎で売却して枠を空けよう</small>':''}</div>`+S.mkt.map((x,i)=>`<div class=card>${horsePic(x,80)}<br><b>${x.n}</b>　総合${ovr(x)}　${x.st}<br><small>速${x.spd} 持${x.sta} 力${x.pow} 根${x.gut} 賢${x.int}</small><br><button ${S.hs.length>=10||S.m<price(x)?'disabled':''} onclick="buy(${i})">購入 ${yen(price(x))}</button></div>`).join('')+`<button class="big s" onclick="S.mkt=null;R()">入荷更新</button>`}
function buy(i){const x=S.mkt[i];if(S.hs.length>=10||S.m<price(x))return;S.m-=price(x);S.hs.push(x);S.mkt.splice(i,1);save();toast(x.n+'を購入!');R()}
function doTrain(h,k){if(k=='rest'){h.fat=Math.max(0,h.fat-40);return'休養 疲労-40'}if(h.fat>80){if(rnd(10)<3)h.gut=Math.max(20,h.gut-1);h.fat=Math.min(100,h.fat+5);return'疲労で効果なし…休養しよう!'}const key=k=='int'?'int':k,g=Math.max(1,Math.round((1+rnd(3))*(h[key]>80?.5:1)));h[key]+=g;if(k=='int')h.gut+=1;h.fat=Math.min(100,h.fat+(k=='int'?6:15));return L[key]+' +'+g}
function auto(h){if(h.fat>60)return doTrain(h,'rest');const ks=['spd','sta','pow','gut'].sort((a,b)=>h[a]-h[b]);return doTrain(h,ks[0])}
function tr(k){const h=H();S.t.tr++;toast(k=='auto'?auto(h):doTrain(h,k));beep(520,.08);save();R()}
function trAll(){S.hs.forEach(h=>auto(h));S.t.tr++;toast('全頭おまかせ育成を実行!');save();R()}
function train(){const h=H(),d=[1200,1800,2400];const bt=[['auto','🤖 おまかせ育成','おすすめを自動選択'],['spd','⚡ スピード','スピード↑ 疲労↑'],['sta','🫁 スタミナ','スタミナ↑ 疲労↑'],['pow','💥 パワー','パワー↑ 疲労↑'],['int','🧠 メンタル','賢さ・根性↑ 疲労小'],['rest','🛌 休養','疲労↓↓']];
 return`<div class="card hint">${hint()}</div><div class=card><div class=row><button class=s onclick="S.sel=(S.sel+S.hs.length-1)%S.hs.length;R()">◀</button><b style="font-size:18px">${h.n}</b><button class=s onclick="S.sel=(S.sel+1)%S.hs.length;R()">▶</button></div><div style="text-align:center">${horsePic(h,120)}</div>総合 <b>${ovr(h)}</b>　${h.st}　${cond(h)}<br><small>疲労 ${h.fat}/100</small><div class=bar><i style="width:${h.fat}%;background:${h.fat>80?'#e53935':h.fat>60?'#fb8c00':'var(--a)'}"></i></div>`+Object.keys(L).map(k=>`${L[k]} ${h[k]}<div class=bar><i style="width:${Math.min(100,h[k])}%"></i></div>`).join('')+`<small>適性 短距離${rk(str(h,1200))}／中距離${rk(str(h,1800))}／長距離${rk(str(h,2400))}</small></div><div class=card>${bt.map(([k,l,s])=>`<button class=big ${k=='rest'?'s':''} onclick="tr('${k}')">${l}<br><small style="color:#fffc">${s}</small></button>`).join('')}<button class="big s" onclick="trAll()">全頭おまかせ育成</button></div>`}
function race(){const h=H(),sb=V.sub;if(sb=='entry')return entry();if(sb=='run')return runView();if(sb=='res')return resView();
 const rec=CL.reduce((a,c,i)=>h.w>=c.w&&c.r<=ovr(h)+8?i:a,0);
 return`<div class="card hint">出走馬：<b>${h.n}</b>　総合${ovr(h)}　${cond(h)}${h.fat>60?'<br>⚠ 疲労が高め。育成で休養させよう':''}</div>${S.m<MIN?workCard():''}`+CL.map((c,i)=>{const lock=h.w<c.w;return`<div class=card style="${lock?'opacity:.5':''}"><b>${c.n}</b>${i==rec?' ⭐おすすめ':''}<br><small>1着賞金 ${yen(c.b)}　参加費 ${yen(c.b*.08)}${lock?`　🔒${c.w}勝で解放`:''}</small><br><button ${lock||S.m<c.b*.08?'disabled':''} onclick="setup(${i})">この条件で出走</button></div>`}).join('')+`<div class=card><button class=s onclick="go('train')">出走馬を変える/育成</button></div>`}
function setup(ci){const h=H(),c=CL[ci],d=[1200,1600,2000,2400][rnd(4)],f=[{n:h.n,h,me:1}];for(let i=0;i<7;i++){const n=mk(c.r);f.push({n:n.n,h:n})}f.sort(()=>Math.random()-.5);f.forEach(x=>{x.s=str(x.h,d);x.st=x.h.st});
 const sc=()=>f.map((x,i)=>[x.s*(.85+Math.random()*.3),i]).sort((a,b)=>b[0]-a[0]).map(a=>a[1]),sims=[];for(let n=0;n<1500;n++)sims.push(sc().slice(0,3));
 const res=sc();res.forEach((i,k)=>{const x=f[i];x.T=1+k*.014;x.c=SK[x.st]*1.2+(Math.random()-.5)*.04;x.a=(Math.random()-.5)*.03;x.x=0});
 V.race={f,d,c,ci,sims,res,surf:Math.random()<.7?'芝':'ダート',bets:[]};V.bet={t:'win',sel:[],a:1000};go('race','entry')}
const mt=(t,s,o)=>t=='win'?o[0]==s[0]:t=='plc'?o.includes(s[0]):(t=='quin'||t=='waku')?s.every(x=>o.slice(0,2).includes(x)):t=='exa'?o[0]==s[0]&&o[1]==s[1]:t=='tri'?s.every((x,i)=>o[i]==x):s.every(x=>o.includes(x));
const odds=(t,s)=>{const r=V.race,p=r.sims.filter(o=>mt(t,s,o)).length/1500;return Math.min(999,Math.max(1.1,.78/Math.max(p,.5/1500)))};
function entry(){const r=V.race,b=V.bet,[nm,need]=TY[b.t],ow=r.f.map((x,i)=>odds('win',[i])),pop=ow.map(o=>ow.filter(p=>p<o).length+1),full=b.sel.length==need;
 return`<div class=card><b>${r.c.n}</b>　${r.d}m ${r.surf}<br><small>参加費 ${yen(r.c.b*.08)}　8頭立て(NPC7頭)</small></div><div class=card><table>${r.f.map((x,i)=>`<tr><td><span class=num style="position:static;display:inline-block;background:${PC[i]}">${i+1}</span></td><td>${x.me?'⭐':''}${x.n}</td><td>${x.st}</td><td>${ow[i].toFixed(1)}倍</td><td>${pop[i]}人気</td></tr>`).join('')}</table></div>
 <div class=card><b>馬券</b><div>${Object.keys(TY).map(k=>`<span class="chip ${b.t==k?'on':''}" onclick="V.bet.t='${k}';V.bet.sel=[];R()">${TY[k][0]}</span>`).join('')}</div><small>${need}頭を選択${['exa','tri'].includes(b.t)?'(着順どおりに)':''}${b.t=='plc'||b.t=='wide'||b.t=='trio'?'(3着以内)':''}</small><div>${r.f.map((x,i)=>`<span class="chip ${b.sel.includes(i)?'on':''}" onclick="pick(${i})">${i+1}</span>`).join('')}</div><div>${[100,1000,5000,10000].map(a=>`<span class="chip ${b.a==a?'on':''}" onclick="V.bet.a=${a};R()">${a}</span>`).join('')}</div>${full?`<p>${b.sel.map(i=>i+1).join(b.t=='exa'||b.t=='tri'?'→':'-')}　オッズ <b>${odds(b.t,b.sel).toFixed(1)}</b>倍</p>`:'<p><small>馬番を選んでください</small></p>'}<button ${full&&S.m>=b.a+r.c.b*.08?'':'disabled'} onclick="placeBet()">${nm}を購入 ${yen(b.a)}</button>${r.bets.length?`<br><small>購入済み：</small>`+r.bets.map(x=>`<br><small>${TY[x.t][0]} ${x.sel.map(i=>i+1).join('-')} ${yen(x.a)} (${x.o.toFixed(1)}倍)</small>`).join(''):''}</div>
 <button class=big onclick="startRun()">🏁 レース開始</button><button class="big s" onclick="cancelRace()">出走をやめる(馬券は返金)</button>`}
function pick(i){const b=V.bet,n=TY[b.t][1];if(b.sel.includes(i))b.sel=b.sel.filter(x=>x!=i);else if(b.sel.length<n)b.sel.push(i);else if(n==1)b.sel=[i];R()}

 +C0(`<b>出品する</b><br>`+hs.map((x,j)=>`<span class="chip ${j==i?'on':''}" onclick="O.sel=${j};R()">${x.n}</span>`).join('')+`<div style="margin:8px 0">${hcard(hs[i])}</div><div>${[10000,50000,100000,500000].map(a=>`<span class="chip ${O.ap==a?'on':''}" onclick="O.ap=${a};R()">開始${yen(a)}</span>`).join('')}</div><button ${hs.length<2||!O.ap?'disabled':''} onclick="oPost('/api/auction/list',{i:${i},price:O.ap,mins:30},'出品しました(30分)');O.auc=null">この馬を出品(30分)</button>`)
 +(A.list.length?A.list.map(a=>C0(`${hcard(a.horse)}<div class=row><small>出品:${a.sname}<br>${a.bid?`現在 <b>${yen(a.bid)}</b> (${a.bname}${a.top?'・あなた':''})`:`開始 ${yen(a.min)}`}<br>残り ${left(a.end)}</small>${a.mine?`<button class=s ${a.bid?'disabled':''} onclick="oPost('/api/auction/cancel',{id:'${a.id}'},'取り下げました');O.auc=null">取り下げ</button>`:`<button ${a.top?'disabled':''} onclick="oPost('/api/auction/bid',{id:'${a.id}',amount:${nb(a)}},'入札しました');O.auc=null">${yen(nb(a))}で入札</button>`}</div>`)).join(''):C0('<small>現在の出品はありません</small>'))}
async function oDaily(){try{const j=await api('/api/daily/claim',{});O.me=j.player;toast(`🎁 +¥${j.result.r.toLocaleString()} (${j.result.st}日連続)`)}catch(e){toast(e.message)}oRe()}
const dailyCard=()=>(O.me.dl||{}).d==new Date().toISOString().slice(0,10)?'':C0(`<button class=s onclick="oDaily()">🎁 ログインボーナスを受け取る</button> <small>連続${(O.me.dl||{}).s|0}日・7日連続で限定勝負服</small>`);
const facHtml=f=>`<b>🏗 厩舎設備</b>`+[['tr','調教場','育成の伸びにボーナス'],['rest','休養施設','休養の回復量アップ']].map(([k,n,d])=>{const lv=f[k]|0;return`<div class=row><span>${n} Lv${lv}/5<br><small>${d}</small></span><button ${lv>=5||O.me.m<100000*(lv+1)?'disabled':''} onclick="oPost('/api/facility/up',{k:'${k}'},'強化しました');O.stf=null">${lv>=5?'MAX':yen(100000*(lv+1))}</button></div>`}).join('');
function oProf(){if(!O.ach){oAch();return C0('読み込み中…')}const p=O.me,w=p.hs.reduce((a,h)=>a+h.w,0),hall=(p.stud||[]).filter(h=>h.w>=3).length;return C0(`<b>🪪 ${p.name}</b>　称号：<b>${O.ach.title}</b><br><small>ポイント ${p.pts}　オンライン${p.r|0}戦${p.w|0}勝　資金 ${yen(p.m)}<br>所有馬 ${p.hs.length}/10　引退馬 ${(p.stud||[]).length}(殿堂 ${hall})　馬の通算勝利 ${w}</small>`)+C0(oAchs())}
const PG={auc:oAuction,solo:oSolo,prof:oProf,breed:oBreed,shop:oShop,staff:oStaff,friend:oFriends,event:oEvent};
function online(){const C=h=>`<div class=card>${h}</div>`;
 if(!O.tok)return C(`<b>🌐 オンライン</b><p><small>アカウント登録/ログイン(サーバー接続が必要です)</small></p><input id=un placeholder="ユーザー名(2〜12字)"><input id=pw type=password placeholder="パスワード(6字以上)"><button onclick="oAuth('register')">新規登録</button><button class=s onclick="oAuth('login')">ログイン</button>${O.msg?`<p>${O.msg}</p>`:''}`);
 if(!O.me){oLoad();return C('読み込み中…')}
 if(V.sub=='res'&&!(O.bt&&O.bt.open)){const r=V.race.raw;return C(`<h3 style="margin:0">レース結果</h3><div style="display:flex;gap:6px">${r.order.slice(0,3).map((i,k)=>`<div style="text-align:center;font-size:12px">${entryPic(r.entries[i])}<br>${k+1}着 ${r.entries[i].name}</div>`).join('')}</div>`+r.order.map((i,k)=>`<div style="${r.entries[i].owner==O.me.name?'font-weight:bold;color:var(--a)':''}">${k+1}着 ${r.entries[i].name} <small>(${r.entries[i].owner})</small></div>`).join(''))+(V.race.raw.tour?C(`<b>🏆 大会 第${V.race.raw.tour.round}/3レース終了</b><br>`+V.race.raw.tour.table.map(([n,pt],i)=>`${i+1}位 ${n} ${pt}pt`).join('<br>')):'')+C((()=>{const y=(V.race.raw.pay||{})[O.me.name];return y?`賞金 <b>${yen(y.prize)}</b>　馬券払戻 <b>${yen(y.bet)}</b>　(購入 ${yen(y.stake)})`:'<small>賞金・払戻はサーバーに反映済みです</small>'})())+`<button class=big onclick="oRpDlCur()">💾 リプレイを保存(JSON)</button><button class="big s" onclick="oRecord(V.race.raw)">🎬 動画で保存(WebM)</button><button class=big onclick="go('online')">ロビーへ</button>`}
 if(O.bt&&O.bt.open)return oBet();if(O.room){const m=O.room;return C(`<b>ルーム ${m.id}</b>　${m.dist}m ${condStr(m.cond)}　${m.st}<br><small>${({quick:'クイック(25秒で自動開始)',ranked:'ランクマッチ '+TNm[m.tier|0]+'(総合'+CAPc[m.tier|0]+'まで)',tour:'大会(3レース総合ポイント)'})[m.mode]||'フレンド(全員準備完了で開始)'}　NPC補充 ${m.npc}頭</small>`)+C(m.players.map(p=>`<div>${p.online?'🟢':'⚪'} ${p.name}　${p.horse?'🐎'+p.horse:'(馬未選択)'}${p.ready?' ✅READY':''}</div>`).join(''))+C(`<b>出走馬を選ぶ(1頭)</b><br>`+O.me.hs.map((h,i)=>`<span class=chip onclick="ws_({type:'pick',idx:${i}})">${h.n} 総合${ovr(h)}</span>`).join(''))+`<button class=big onclick="ws_({type:'ready',go:true})">準備完了</button><button class="big s" onclick="ws_({type:'leave'});O.room=null;R()">退出</button>`}
 const TB=oTabs();if(O.pg&&O.pg!='lobby')return TB+(PG[O.pg]||(()=>''))();return TB+C(`<b>🌐 ${O.me.name}</b>　${O.me.pts}pt[${TNm[oTier(O.me.pts)]}]　${yen(O.me.m)}　${O.me.hs.length}/10頭`)+(O.msg?C(O.msg).replace('class=card','class="card hint"'):'')+C(`<button class=big ${O.me.imported?'disabled':''} onclick="oImport()">(任意)単体版の厩舎を取り込む(初回のみ・上書き)</button><button class=big ${O.me.hs.length&&!oLock()?'':'disabled'} onclick="oConn('quick')">② クイックマッチ</button><button class=big ${O.me.hs.length&&!oLock()?'':'disabled'} onclick="oConn('ranked')">ランクマッチ</button><button class=big ${O.me.hs.length&&!oLock()?'':'disabled'} onclick="oConn('tour')">🏆 大会(3レース総合)</button><button class="big s" ${O.me.hs.length&&!oLock()?'':'disabled'} onclick="oConn('room')">フレンドルーム作成</button><input id=cd maxlength=4 placeholder="ルームコード"><button class=s onclick="oConn('code',$('#cd').value)">コードで参加</button><button class=s onclick="oConn('rejoin')">再接続</button>`)+C(oHorses())+C(oMarket())+C(oAchs())+C(oReplays())+C(oRivals())+C(`<button class=s onclick="oRank()">ランキング</button><button class=s onclick="oRank(0,1)">馬ランキング</button>${O.rank?O.rank.map((x,i)=>`<div>${i+1}位 ${x.name} ${x.pts}pt</div>`).join(''):''}<button class=s onclick="O.tok='';O.me=null;try{localStorage.removeItem('dd_tok')}catch(e){}R()">ログアウト</button>`)}

R();
</script></body></html>
